<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Badge — preview</title></head>
<body>
<div id="root" class="cp-row"></div>
<script>
  var C = window.CarPal, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(C.Badge, { icon: 'car' }, 'Car owner'),
    h(C.Badge, { tone: 'accent', icon: 'wrench' }, 'Mechanic'),
    h(C.Badge, { tone: 'accent', icon: 'store' }, 'Parts seller'),
    h(C.Badge, { tone: 'signal', icon: 'star' }, 'Top rated'),
    h(C.Badge, { tone: 'success', icon: 'check' }, 'In stock'),
    h(C.Badge, { tone: 'danger', icon: 'alert' }, 'Out of stock'),
    h(C.Badge, { tone: 'accent', icon: 'wrench' }, 'تعمیرکار')));
</script>
</body>
</html>
