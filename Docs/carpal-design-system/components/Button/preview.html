<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div id="ltr" class="cp-row"></div>
<div id="rtl" class="cp-row" dir="rtl" lang="fa"></div>
<script>
  var C = window.CarPal, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('ltr')).render(h(React.Fragment, null,
    h(C.Button, { variant: 'primary', icon: 'wrench' }, 'Book service'),
    h(C.Button, { icon: 'chat' }, 'Message seller'),
    h(C.Button, { variant: 'ghost', iconEnd: 'next' }, 'See reviews'),
    h(C.Button, { variant: 'danger', size: 'sm' }, 'Delete review'),
    h(C.Button, { disabled: true, size: 'sm' }, 'Out of stock')));
  ReactDOM.createRoot(document.getElementById('rtl')).render(h(React.Fragment, null,
    h(C.Button, { variant: 'primary', icon: 'wrench' }, 'رزرو تعمیرگاه'),
    h(C.Button, { icon: 'chat' }, 'پیام به فروشنده'),
    h(C.Button, { variant: 'ghost', iconEnd: 'next' }, 'دیدن نظرها'),
    h(C.Button, { variant: 'danger', size: 'sm' }, 'حذف نظر')));
</script>
</body>
</html>
