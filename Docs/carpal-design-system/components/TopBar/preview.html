<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TopBar — preview</title></head>
<body>
<div id="ltr"></div><div style="height:16px"></div><div id="rtl" dir="rtl" lang="fa"></div>
<script>
  var C = window.CarPal, h = React.createElement;
  var act = function (l) { return h('button', { className: 'cp-iconbtn', 'aria-label': l }, h(C.Icon, { name: 'share' })); };
  ReactDOM.createRoot(document.getElementById('ltr')).render(h(C.TopBar, { title: 'Karimi Auto Service', onBack: null, actions: act('Share') }));
  ReactDOM.createRoot(document.getElementById('rtl')).render(h(C.TopBar, { title: 'تعمیرگاه کریمی', onBack: null, backLabel: 'بازگشت', actions: act('اشتراک') }));
</script>
</body>
</html>
