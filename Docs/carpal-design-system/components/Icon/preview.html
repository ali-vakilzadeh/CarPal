<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Icon — preview</title></head>
<body>
<div id="root" class="cp-row"></div>
<script>
  var C = window.CarPal, h = React.createElement;
  var names = ['home','search','plus','chat','user','heart','comment','share','car','wrench','part','store','star','pin','back','next','arrow','more','check','alert','bell'];
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, names.map(function (n) { return h(C.Icon, { key: n, name: n, label: n }); })));
</script>
</body>
</html>
