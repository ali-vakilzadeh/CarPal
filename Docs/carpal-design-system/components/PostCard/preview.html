<!-- @dsCard group="Feed" height=520 subtitle="A mechanic review (EN) and a found part (FA)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PostCard — preview</title></head>
<body>
<div class="cp-split" style="background:var(--surface-sunken)"><div id="ltr"></div><div id="rtl" dir="rtl" lang="fa"></div></div>
<script>
  var C = window.CarPal, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('ltr')).render(h(C.PostCard, {
    author: 'Sara Ahmadi', handle: '@sara.a', role: 'owner', time: '12 min',
    text: 'My 206 had a grinding noise for weeks. Reza at Karimi Auto found a worn wheel bearing in ten minutes, showed me the old part and charged exactly what he quoted. Honest mechanic — highly recommended.',
    tagged: [{ icon: 'wrench', title: 'Karimi Auto Service', detail: 'Mechanic · Sattarkhan St, Tehran', rating: 4.9 }],
    likes: 48, comments: 6, liked: true, cta: 'Book service' }));
  ReactDOM.createRoot(document.getElementById('rtl')).render(h(C.PostCard, {
    author: 'مریم نوری', handle: '@maryam.n', role: 'owner', time: '۸ دقیقه پیش', locale: 'fa', highlight: true,
    labels: { share: 'اشتراک', more: 'بیشتر', roles: { owner: 'مالک خودرو' } },
    text: 'دنبال لنت ترمز اصلی برای Peugeot 207 بودم. با جستجوی شماره فنی در CarPal همان روز در یک فروشگاه نزدیک پیدا شد و قیمت از بازار کمتر بود.',
    tagged: [{ icon: 'part', title: 'لنت ترمز جلو (اصلی)', detail: 'لوازم یدکی پارس · مناسب Peugeot 206 و 207', price: '۱٬۸۵۰٬۰۰۰ تومان', badge: { text: 'موجود', icon: 'check' } }],
    likes: 1250, comments: 32, cta: 'خرید قطعه' }));
</script>
</body>
</html>
