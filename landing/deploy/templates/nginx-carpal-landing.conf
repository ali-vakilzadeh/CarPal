# CarPal landing site behind nginx (installed by landing-setup.sh as /etc/nginx/sites-available/carpal-landing).
# Static files only: no backend, no cookies, no forms. Port 80 only; `certbot --nginx` adds TLS and the redirect.
# The bare <DOMAIN> redirects here from the backend's site (or the PWA's); this file owns only the www host.

server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name @LANDING_HOST@;

    root @LANDING_ROOT@/current;
    index index.html;
    error_page 404 /404.html;
    charset utf-8;
    client_max_body_size 1k;

    # The pages load only their own files, so the policy can be this tight: keep scripts and styles in files.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # .htaccess belongs to the cPanel copy of this site, so nginx does not serve it.
    location = /.htaccess { return 404; }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
    # File names carry no hash, so an hour keeps a new release from waiting long in browsers.
    location ~* \.(?:css|js|png|svg|woff2?)$ {
        limit_except GET HEAD { deny all; }
        expires 1h;
        try_files $uri =404;
    }
}
