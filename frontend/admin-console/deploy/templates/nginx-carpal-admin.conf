# CarPal admin console behind nginx (/etc/nginx/sites-available/carpal-admin, written by admin-setup.sh).
# Port 80 only; `certbot --nginx --redirect` adds the TLS server block and answers port 80 with a redirect to https
# (OQ-11). The console sets its own security headers (CSP with nonces and Trusted Types, HSTS outside dev, no-store,
# noindex); nginx adds none of its own.
#
# Access gate (ADMIN_GATE in admin-deploy.conf, SEC-ADM-1, OQ-02): rendered into every location below (allow/deny
# lines, or a comment for ADMIN_GATE=none). Per location, never per server, so certbot's challenge location answers.
# admin-setup.sh re-renders this file while it has no TLS block; after certbot, it leaves the file alone and you edit
# the allow lines by hand in both server blocks (deploy.md "Access gate").

# Per-client limits by the real client address. The console's /id proxy calls the auth host from 127.0.0.1; the
# console states the visitor in CarPal-Forwarded-Client, and these zones keep a per-address limit at the edge too.
# Names differ from the backend's and the PWA's zones: nginx refuses a zone defined twice. Nothing else is set at the
# http level: the backend's site (nginx-carpal.conf) already sets limit_req_status there, and nginx refuses a
# directive given twice in one context, so this site sets it inside its server block.
limit_req_zone $binary_remote_addr zone=carpal_admin_signin:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=carpal_admin_code:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=carpal_admin:10m rate=20r/s;

# --- admin.<domain>: the staff console (next start on 127.0.0.1:@ADMIN_PORT@) ----------------
server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name @ADMIN_CONSOLE_HOST@;
    limit_req_status 429;

    # The BFF accepts 256 KiB policy texts (admin.policy_version_create/update) and 64 KiB otherwise; media goes
    # straight from @MEDIA_HOST@ to the browser.
    client_max_body_size 512k;

    # Password sign-in and the start of a lost-key recovery (both take a password or a recovery code).
    location = /id/v1/auth/signin {
        @GATE_RULES@
        limit_req zone=carpal_admin_signin burst=20 nodelay;
        proxy_pass http://127.0.0.1:@ADMIN_PORT@;
        include /etc/nginx/snippets/carpal-admin-proxy.conf;
    }
    location ~ ^/id/v1/auth/staff-recovery(/verify)?$ {
        @GATE_RULES@
        limit_req zone=carpal_admin_signin burst=10 nodelay;
        proxy_pass http://127.0.0.1:@ADMIN_PORT@;
        include /etc/nginx/snippets/carpal-admin-proxy.conf;
    }
    # Steps that send an emailed code (passkey enrolment, the first password change, a password reset).
    location ~ ^/id/v1/auth/(passkey-enrolment/options|password/initial|password-reset)$ {
        @GATE_RULES@
        limit_req zone=carpal_admin_code burst=10 nodelay;
        proxy_pass http://127.0.0.1:@ADMIN_PORT@;
        include /etc/nginx/snippets/carpal-admin-proxy.conf;
    }
    # Everything else: pages, the BFF (/bff, /api), the rest of /id and the build files (/_next/static/ is
    # content-hashed; Next.js sends "immutable" caching for it).
    location / {
        @GATE_RULES@
        limit_req zone=carpal_admin burst=100 nodelay;
        proxy_pass http://127.0.0.1:@ADMIN_PORT@;
        include /etc/nginx/snippets/carpal-admin-proxy.conf;
    }
}
