<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CarPal Admin">
  <!-- Console icon (AC4): the PWA's car glyph (pwa/src/app/icon.svg) on Metal black (#0c1136, tokens.css) instead of the
       PWA's Metal blue, so a staff tab is told apart from the public app. Served as /icon.svg with a <link rel="icon">,
       so browsers do not ask for /favicon.ico (which would otherwise reach the console layout and start a sign-in). -->
  <rect width="32" height="32" rx="8" fill="#0c1136"/>
  <g transform="translate(4 4)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 17v-4l2.2-5.5A2 2 0 0 1 7 6h10a2 2 0 0 1 1.8 1.5L21 13v4z"/>
    <path d="M5 17v2"/><path d="M19 17v2"/><path d="M7.5 13.5h.01"/><path d="M16.5 13.5h.01"/>
  </g>
</svg>
