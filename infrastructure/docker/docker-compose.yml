# CarPal local "full mode" stack (GD-04): the real services behind the backend's
# infrastructure ports. Lite mode (embedded PostgreSQL + in-process adapters) needs
# none of this.
#
# STATUS: written in backend stage S1 but NOT verified (no Docker on the dev machine
# that produced it). Verify before relying on it and record the result in
# backend/dev_plan.json.
#
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#   cd backend && CARPAL_DB_MODE=external pnpm db:setup
#
# Ports and credentials match backend/.env.example, so only CARPAL_DB_MODE changes.
# Development credentials only; every service listens on 127.0.0.1.
name: carpal

services:
  postgres:
    # PostgreSQL 16 with pgvector (42 §1): no lite-mode vector shim is applied here.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: postgres
      TZ: UTC
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'max_connections=200']
    ports: ['127.0.0.1:54329:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 20

  redis:
    # Sessions, idempotency keys, rate-limit windows, flags cache, BullMQ (41 §3.1).
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redisdata:/data]

  nats:
    # Domain event streams relayed from the outbox (41 §6.1), JetStream enabled.
    image: nats:2.10-alpine
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports: ['127.0.0.1:4222:4222', '127.0.0.1:8222:8222']
    volumes: [natsdata:/data]

  opensearch:
    # Search projections (52 §10). OpenSearch is the Elasticsearch-compatible option of Plan §2.
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ['127.0.0.1:9200:9200']
    volumes: [osdata:/usr/share/opensearch/data]

  minio:
    # S3-compatible object storage for media, documents, exports (41 §3.1).
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: carpal
      MINIO_ROOT_PASSWORD: carpal_dev_secret
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [miniodata:/data]

  mailpit:
    # Catches outgoing email (verification, password reset, review invitations).
    image: axllent/mailpit:v1.21
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']

volumes:
  pgdata:
  redisdata:
  natsdata:
  osdata:
  miniodata:
