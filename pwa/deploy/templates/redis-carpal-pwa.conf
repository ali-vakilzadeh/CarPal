# CarPal PWA settings for the local Redis (/etc/redis/carpal-pwa.conf, included at the end of /etc/redis/redis.conf
# by pwa-setup.sh, so these lines win). Redis holds the BFF sessions only (keys cp:bff:sess:<id>, each with a TTL).
bind 127.0.0.1 -::1
protected-mode yes
port @REDIS_PORT@
requirepass @REDIS_PASSWORD@
# Sessions expire on their own (SET PX); under memory pressure the oldest of them go first, never a key without TTL.
maxmemory @REDIS_MAXMEMORY@
maxmemory-policy volatile-lru
# Snapshots keep sessions across a Redis restart (users stay signed in); no append-only log needed.
save 900 1
save 300 100
appendonly no
