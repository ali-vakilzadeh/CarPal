# CarPal consumer PWA behind nginx (installed by pwa-setup.sh as /etc/nginx/sites-available/carpal-pwa) — only when
# no enabled site serves @WEB_HOST@ yet. The backend's nginx-carpal.conf has the same two server blocks; on a server
# set up with that template this file is not installed. Port 80 only; `certbot --nginx` adds TLS and the redirect.
# The PWA sets its own security headers (CSP with nonces, HSTS on https); nginx adds none of its own.

# Per-client limits by the real client address (the PWA's /id proxy forwards sign-in calls to the auth host from
# 127.0.0.1, so the auth host cannot tell clients apart: deploy.md "Known limitations").
limit_req_zone $binary_remote_addr zone=carpal_web_signin:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=carpal_web_otp:10m rate=20r/h;
limit_req_zone $binary_remote_addr zone=carpal_web:20m rate=30r/s;
limit_req_status 429;

# --- pwa.<domain>: the consumer PWA (next start on @PWA_PORT@) ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name @WEB_HOST@;

    client_max_body_size 1m;            # media goes straight to @MEDIA_HOST@; the BFF forwards JSON only

    location = /id/v1/auth/signin {
        limit_req zone=carpal_web_signin burst=30 nodelay;
        proxy_pass http://127.0.0.1:@PWA_PORT@;
        include /etc/nginx/snippets/carpal-pwa-proxy.conf;
    }
    location /id/v1/auth/otp/ {
        limit_req zone=carpal_web_otp burst=20 nodelay;
        proxy_pass http://127.0.0.1:@PWA_PORT@;
        include /etc/nginx/snippets/carpal-pwa-proxy.conf;
    }
    # Build files (/_next/static/) are content-hashed; Next.js itself sends "immutable" caching for them.
    location / {
        limit_req zone=carpal_web burst=200 nodelay;
        proxy_pass http://127.0.0.1:@PWA_PORT@;
        include /etc/nginx/snippets/carpal-pwa-proxy.conf;
    }
}

# --- <domain>: redirects to the landing site (www.<domain>), served by landing/deploy ------------------
server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name @DOMAIN@;

    # In a location, not at server level, so certbot's /.well-known/acme-challenge/ location still answers.
    location / {
        return 301 https://@LANDING_HOST@$request_uri;
    }
}
