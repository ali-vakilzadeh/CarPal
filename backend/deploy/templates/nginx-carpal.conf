# CarPal backend behind nginx (installed by server-setup.sh as /etc/nginx/sites-available/carpal).
# Port 80 only; `certbot --nginx` adds the TLS server blocks and the HTTP -> HTTPS redirect (deploy.md step 6).
# The backend sets its own security headers (40 §1.4, incl. HSTS); nginx adds none of its own.

# Per-client limits by the real client address. The backend only sees 127.0.0.1 behind this proxy,
# so these zones stand in for its per-IP windows (auth.signin 30 / 15 min, auth.otp 20 / h,
# public.read 600 / min per /24) until the backend trusts X-Forwarded-For (deploy.md "Known limitations").
limit_req_zone $binary_remote_addr zone=carpal_signin:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=carpal_otp:10m rate=20r/h;
limit_req_zone $binary_remote_addr zone=carpal_public:20m rate=10r/s;
# General guard for the API host (one address may hide many mobile users behind carrier NAT).
limit_req_zone $binary_remote_addr zone=carpal_api:20m rate=30r/s;
limit_req_status 429;

# --- api.<domain>: consumer and business API (8080) ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name @API_HOST@;

    client_max_body_size 1m;            # the API refuses bodies over 64 KiB itself (413)

    location / {
        limit_req zone=carpal_api burst=200 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/carpal-proxy.conf;
    }
}

# --- id.<domain>: authorization server and hosted sign-in endpoints (8082) -----------
server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name @AUTH_HOST@;

    client_max_body_size 64k;

    location = /v1/auth/signin {
        limit_req zone=carpal_signin burst=30 nodelay;
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/carpal-proxy.conf;
    }
    location /v1/auth/otp/ {
        limit_req zone=carpal_otp burst=20 nodelay;
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/carpal-proxy.conf;
    }
    location / {
        limit_req zone=carpal_public burst=50 nodelay;
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/carpal-proxy.conf;
    }
}

# --- media.<domain>: signed upload (PUT) and download URLs (8083) --------------------
# 40 SEC-UP wants a separate registrable domain (media.carpal-usercontent.app) in production.
server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name @MEDIA_HOST@;

    client_max_body_size 105m;          # MediaAsset.file_size_bytes <= 100 MiB
    proxy_request_buffering off;        # stream uploads to the storage listener

    location /o/ {
        proxy_pass http://127.0.0.1:8083;
        include /etc/nginx/snippets/carpal-proxy.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location / {
        return 404;
    }
}

# --- admin-api.<domain> (8081): not published by default (SEC-ADM-1) -----------------
# Reach it through an SSH tunnel:  ssh -L 8081:127.0.0.1:8081 root@<server>
# server-setup.sh appends a server block here when EXPOSE_ADMIN_API=1 (ADMIN_ALLOW_IPS only).
