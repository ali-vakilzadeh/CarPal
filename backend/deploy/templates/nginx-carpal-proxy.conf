# Shared proxy settings of the CarPal server blocks (/etc/nginx/snippets/carpal-proxy.conf).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
# proxy_read_timeout / proxy_send_timeout stay at nginx's 60s default: not set here, because nginx refuses a
# directive given twice in one block and the media upload location sets its own 300s after including this file.
proxy_buffering on;
proxy_buffer_size 16k;                  # the PWA block includes this file; its Set-Cookie and CSP headers exceed the 4k default
proxy_buffers 8 16k;
